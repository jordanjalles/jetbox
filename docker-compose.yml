version: '3.8'
services:
  user:
    build: ./user
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///user.db
  product:
    build: ./product
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=sqlite:///product.db
  order:
    build: ./order
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=sqlite:///order.db
    depends_on:
      - user
      - product
