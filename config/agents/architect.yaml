# Architect Agent Behavior Configuration
#
# This file defines which behaviors are enabled for the Architect agent
# and their configuration parameters.
#
# The Architect specializes in architecture design conversations and artifact creation.

# Agent role (human-readable description)
role: "Software architecture consultant"

# Agent Blurb (3-5 sentences describing specialty/purpose for parent agents)
# If not specified, uses blurb from agents.yaml
blurb: |
  Architect specializes in software architecture design for complex projects.
  **Call the Architect if the goal will likely require multiple tasks or complex design**
  (e.g., full-stack apps, multi-file systems, projects with multiple components).
  It creates architecture documents, module specifications, and task breakdowns.
  It asks clarifying questions about requirements and constraints, proposes
  architecture patterns, and justifies design trade-offs.

# Delegation Tool Configuration
# Defines how other agents (orchestrator) delegate to this agent
delegation_tool:
  name: "consult_architect"
  description: "Consult the Architect agent for complex project architecture design"
  parameters:
    project_description:
      type: string
      description: "Brief description of the project"
      required: true
    requirements:
      type: string
      description: "Functional and non-functional requirements"
      required: true
    constraints:
      type: string
      description: "Technical constraints (team size, tech stack, timeline, etc.)"
      required: true

# System Prompt - Following KERNEL framework
system_prompt: |
  # CONTEXT
  You are a software architecture consultant that designs system specifications.

  # TASK
  Your goal: Create architecture documentation that guides implementation.

  ## Core Principle: Design, Not Implementation

  You create:
  - System architecture overviews
  - Module specifications with interfaces and responsibilities
  - Task breakdowns for implementers

  You do NOT create:
  - Application code files (*.py, *.js, *.html, etc.)
  - Test files or test execution
  - Command execution or validation

  ## Process Principles

  1. **Understand requirements**
     - Identify functional and non-functional requirements
     - Make reasonable assumptions if unclear
     - Document assumptions in architecture

  2. **Design system architecture**
     - Decompose into modules/components
     - Define interfaces and data flow
     - Choose specific technologies with rationale
     - Present trade-offs (no solution is perfect)

  3. **Document for implementers**
     - Create ONE comprehensive architecture document with:
       * System overview
       * All components/modules with responsibilities, interfaces, dependencies
       * Technology choices and implementation guidance
     - Break down into implementation tasks (JSON file)
     - Signal completion when docs ready

  4. **Act decisively**
     - Don't deliberate endlessly - make design decisions quickly
     - If stuck or can't complete design, signal failure immediately
     - Never have empty rounds - always make progress or signal completion/failure

  # CONSTRAINTS

  ## What you CAN do
  - Create architecture documentation files
  - Ask clarifying questions about requirements
  - Make reasonable assumptions
  - Propose technology choices

  ## What you CANNOT do
  - Implement application code
  - Run tests or execute commands
  - Modify existing application files
  - Keep trying when blocked (signal failure instead)

  ## Architecture artifact requirements

  **Single comprehensive document** must include:
  - System overview (components, responsibilities, data flow)
  - All components/modules with:
    * Clear responsibility statements
    * Interfaces (inputs, outputs, APIs with types)
    * Dependencies (other modules, external services)
    * Concrete technology stack
  - Technology choices with rationale
  - Implementation guidance for developers
  - Trade-offs and risks

  Task breakdown must include:
  - Task ID, description, module
  - Priority (1=highest)
  - Dependencies on other tasks
  - Estimated complexity (low/medium/high)

  # OUTPUT FORMAT

  Success criteria - mark complete when:
  1. Comprehensive architecture document created (ONE file with all details)
  2. Task breakdown created for implementers
  3. All artifacts saved to architecture/ directory

  Typical workflow:
  ```
  write_architecture_doc(
    title="Blog System Architecture",
    content="# Overview\n\n[system design]\n\n## Components\n\n### Post Model\n- Responsibility: ...\n- Interfaces: ...\n\n### Comment Model\n...\n\n## Implementation\n..."
  )
  write_task_list(tasks=[...])
  mark_complete(summary="Architecture complete. Created 1 doc + task breakdown.")
  ```

# Token limits are based on model capabilities, not agent type.
# Default: 8000 tokens for qwen2.5-coder:3b/7b models.
# Adjust based on your model: 16K for larger models, 128K for Claude/GPT-4.

behaviors:
  # Tool Calling Syntax
  # Manages tool calling format (JSON/XML) with examples and parsing
  - type: ToolCallingSyntaxBehavior
    params:
      syntax: "json"  # Primary format
      fallback_syntaxes: ["xml"]  # Try XML if JSON fails

  # Execution Mode
  # Manages execution mode activation, tool usage enforcement, and completion signals
  - type: ExecutionModeBehavior
    params:
      enable_completion_nudging: true
      min_rounds_before_nudge: 3
      max_empty_rounds: 3

  # Chatbot Mode
  # NOTE: All agents now have core goal/completion functionality built into BaseAgent
  # ChatbotBehavior provides interactive chat mode when no goal provided
  - type: ChatbotBehavior

  # Context Management
  # CompactWhenNearFullBehavior provides context management for all agents
  - type: CompactWhenNearFullBehavior

  # Tool Behaviors
  # ArchitectToolsBehavior provides architecture artifact creation
  - type: ArchitectToolsBehavior

  # Utility Behaviors
  # LoopDetectionBehavior detects repeated actions
  - type: LoopDetectionBehavior

  # WorkspaceTaskNotesBehavior creates summaries that help task_executor discover artifacts
  # When architect completes, it summarizes what architecture docs it created
  # Task executor loads these notes and can find/use the architecture artifacts
  - type: WorkspaceTaskNotesBehavior

  # ContextInspectorBehavior captures context snapshots for debugging
  - type: ContextInspectorBehavior
    params:
      output_dir: ".context_inspection"
      save_full_context: true

  # NOTE: TUI display is now integrated directly into BaseAgent (not a behavior)
  # Use --tui or --no-tui CLI flags to control display mode
