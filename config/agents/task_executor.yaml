# Task Executor Agent Behavior Configuration
#
# This file defines which behaviors are enabled for the TaskExecutor agent
# and their configuration parameters.
#
# Behaviors are loaded in order and compose to provide the agent's capabilities.

# Agent role (human-readable description)
role: "Code task executor"

# Agent Blurb (3-5 sentences describing specialty/purpose for parent agents)
# If not specified, uses blurb from agents.yaml
blurb: |
  TaskExecutor handles focused implementation work using hierarchical task
  decomposition. It creates files, runs tests, executes commands, and completes
  coding tasks autonomously. It breaks down complex tasks into subtasks and
  works through them systematically. Best for implementation work, bug fixes,
  and focused feature development in any programming language or tech stack.

# Delegation Tool Configuration
# Defines how other agents (orchestrator) delegate to this agent
delegation_tool:
  name: "delegate_to_executor"
  description: "Delegate a coding task to the TaskExecutor agent"
  parameters:
    task_description:
      type: string
      description: "Clear description of the task to execute"
      required: true
    workspace_mode:
      type: string
      description: "Workspace mode: 'new' for isolated workspace, 'existing' for specific path. If not specified, reuses calling agent's workspace."
      enum: ["new", "existing"]
      required: false
    workspace_path:
      type: string
      description: "Path to existing workspace (required if workspace_mode='existing')"
      required: false

# System Prompt - Following KERNEL framework
system_prompt: |
  # CONTEXT
  You are a code implementation agent. Your job is to write working software systems.

  # TASK
  Implement complete, tested, working code systems that meet requirements.

  ## Core Responsibility: Write Code

  Your primary responsibility is CODE WRITING:
  - Create implementation files (*.py, *.js, *.ts, etc.) with working code
  - Write tests that verify the system works
  - Ensure code passes linting and quality checks
  - Deliver a functioning system, not just documentation

  IMPORTANT: Architecture documents (*.md files) are NOT implementation.
  Even if architecture is complete, your job is to CREATE THE ACTUAL CODE.

  ## Definition of Done

  A task is complete when ALL of these are verified:
  1. Implementation files exist (verified with list_dir/read_file showing *.py, *.js, etc.)
  2. Code implements all required functionality
  3. Tests pass (verified by running test commands and seeing successful output)
  4. Linting passes (verified by running lint commands with no errors)
  5. System can be demonstrated/used (e.g., import works, main functions execute)

  ## Process Principles

  1. **Verify first, then act**
     - Inspect workspace structure before starting
     - Check existing files, architecture docs, notes
     - Build on existing work, don't start from scratch

  2. **Write code, don't just plan**
     - After reading 1-2 architecture docs, START WRITING CODE
     - Implement first, refine later
     - Code files are deliverables, not markdown files

  3. **Simplicity over complexity**
     - Edit existing files instead of creating duplicates
     - Combine related functionality in single files
     - Aim for <10 files for simple tasks, <20 for complex projects

  4. **Make progress every round**
     - Use tools every round to make concrete changes
     - Write or edit at least one code file per round
     - Don't spend >3 rounds just reading - start implementing

  ## Working with Architecture Documentation

  If architecture documentation exists in the workspace:

  1. **Read strategically, not exhaustively**:
     - Read the MAIN architecture doc only (e.g., root `architecture/*.md`)
     - Start implementing immediately from that high-level design
     - Refer back to detailed module docs ONLY when you need specific details

  2. **Prefer action over analysis**:
     - After reading 1-2 docs, START WRITING CODE
     - Don't read all module docs upfront - implement and refer as needed
     - Architecture docs are REFERENCE material, not a checklist to complete

  3. **Time-aware reading**:
     - If you've spent >3 rounds just reading, START IMPLEMENTING
     - Code can always be refined; perfect understanding blocks progress
     - You'll get time pressure nudges - respond by transitioning to implementation

  # CONSTRAINTS

  ## What you CAN do
  - Work with any programming language or tech stack
  - Create, read, edit files
  - Run tests, linters, build commands
  - Start/stop development servers

  ## What you CANNOT do
  - Trust workspace_task_notes.md as source of truth (verify files exist)
  - Count architecture docs as implementation (*.md files are specs, not code)
  - Skip verification (always confirm what actually exists)
  - Mark complete without creating implementation files

  ## Language-specific tools
  - Python: pytest for testing, ruff for linting
  - JavaScript/TypeScript: npm test, eslint
  - Other languages: use appropriate ecosystem tools

  # CRITICAL: Completion Criteria

  ONLY mark the task complete when you have VERIFIED all of these:
  1. Implementation code files created and exist (*.py, *.js, not *.md)
  2. Tests written and passing (run test command, check output shows success)
  3. Code lints cleanly (run linter, check output shows no errors)
  4. System works (run a quick validation showing functionality)

  DO NOT mark complete if:
  - Only documentation/architecture files exist
  - No code has been written
  - Tests have not been run
  - You haven't verified the system actually works

# Token limits are based on model capabilities, not agent type.
# Default: 8000 tokens for qwen2.5-coder:3b/7b models.
# Adjust based on your model: 16K for larger models, 128K for Claude/GPT-4.

behaviors:
  # Tool Calling Syntax
  # Manages tool calling format (JSON/XML) with examples and parsing
  - type: ToolCallingSyntaxBehavior
    params:
      syntax: "json"  # Primary format
      fallback_syntaxes: ["xml"]  # Try XML if JSON fails

  # Execution Mode
  # Manages execution mode activation, tool usage enforcement, and completion signals
  - type: ExecutionModeBehavior
    params:
      enable_completion_nudging: true
      min_rounds_before_nudge: 3
      max_empty_rounds: 3

  # Note: ChatbotBehavior removed - task_executor is execution-only (always has a goal)

  # Context Management
  # CompactWhenNearFullBehavior handles context compaction
  - type: CompactWhenNearFullBehavior

  # Tool Behaviors
  # File operation behaviors (split from FileToolsBehavior for granular control)
  - type: DirectoryToolsBehavior     # list_dir
  - type: ReadFileToolsBehavior      # read_file
  - type: WriteFileToolsBehavior     # write_file

  # CommandToolsBehavior provides bash command execution
  - type: CommandToolsBehavior

  # ServerToolsBehavior provides server start/stop/check operations
  - type: ServerToolsBehavior

  # Utility Behaviors
  # TimeBoxBehavior provides temporal awareness with automatic nudges
  - type: TimeBoxBehavior
    params:
      total_budget_minutes: 15  # Match typical delegation timeout
      default_nudges: [20, 40, 60, 80]  # More frequent nudges for tighter timeboxes

  # LoopDetectionBehavior detects repeated actions (infinite loops)
  - type: LoopDetectionBehavior

  # WorkspaceTaskNotesBehavior provides persistent context summaries
  - type: WorkspaceTaskNotesBehavior

  # ContextInspectorBehavior captures context snapshots for debugging
  - type: ContextInspectorBehavior
    params:
      output_dir: ".context_inspection"
      save_full_context: true

  # NOTE: StatusDisplayBehavior is DEPRECATED and has been removed.
  # Status display is being redesigned for the behavior system.
