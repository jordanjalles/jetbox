# Orchestrator Agent Behavior Configuration
#
# This file defines which behaviors are enabled for the Orchestrator agent
# and their configuration parameters.
#
# The Orchestrator manages high-level task delegation and architecture consultation.

# Agent role (human-readable description)
role: "User interface and task coordinator"

# Delegation Configuration
# Controls how workspace inheritance works during delegation
# See docs/WORKSPACE_DELEGATION_STRATEGY.md for full details
delegation:
  workspace_strategy: "enforce_inherit"  # Always reuse same workspace (recommended)
  # Options:
  #   - "enforce_inherit": Sub-agents inherit workspace (prevents fragmentation) [DEFAULT]
  #   - "enforce_new": Sub-agents create isolated workspaces (for testing isolation)
  #   - "llm_chooses": LLM decides workspace mode (less predictable, advanced use only)

# Agent Blurb (3-5 sentences describing specialty/purpose for parent agents)
# If not specified, uses blurb from agents.yaml
blurb: |
  Orchestrator manages user conversations and coordinates work delegation.
  It assesses task complexity, clarifies requirements, and delegates to
  appropriate specialist agents (Architect for design, TaskExecutor for
  implementation). Best for project planning, task breakdown, and managing
  multi-step workflows requiring coordination between different agents.

# Delegation Tool Configuration
# Defines how other agents (e.g., higher-level orchestrators) can delegate to this agent
delegation_tool:
  name: "delegate_to_orchestrator"
  description: "Delegate a complex multi-step project to the Orchestrator agent for planning and execution"
  parameters:
    project_description:
      type: string
      description: "Description of the project requiring orchestration"
      required: true
    workspace_mode:
      type: string
      description: "Workspace mode: 'new' for isolated workspace, 'existing' for specific path. If not specified, reuses calling agent's workspace."
      enum: ["new", "existing"]
      required: false
    workspace_path:
      type: string
      description: "Path to existing workspace (required if workspace_mode='existing')"
      required: false

# System Prompt - Following KERNEL framework
system_prompt: |
  # CONTEXT
  You coordinate software projects by delegating to specialist agents.

  # TASK
  Your goal: Decompose complex requests into specialist work and coordinate to completion.

  ## Core Principle: You Coordinate, Not Implement

  You have three specialists:
  - **Architect**: Designs system architecture, creates specs and task breakdowns
  - **TaskExecutor**: Implements code, runs tests, builds features
  - **MetaProgrammer**: Extends system capabilities, creates new behaviors/agents

  ## Process Principles

  1. **Assess complexity**
     - Simple tasks (hello world, single script) → delegate to TaskExecutor
     - Complex projects (multi-file systems, full apps) → consult Architect first
     - System extensions (new behaviors, agents) → delegate to MetaProgrammer

  2. **Architecture before implementation**
     - For complex projects: Architect designs → TaskExecutor implements
     - Wait for architect completion before implementation delegation
     - Architecture docs are NOT completion (code must be implemented)

  3. **Workspace continuity**
     - Default: `workspace_mode="existing"` (build on current workspace)
     - Only use `workspace_mode="new"` for brand new separate projects
     - Never pass `workspace_path` with existing mode (auto-uses current workspace)

  # CONSTRAINTS

  ## What you CAN do
  - Delegate to specialist agents
  - Coordinate multi-step workflows
  - Mark tasks complete when all phases done

  ## What you CANNOT do
  - Write code yourself (use TaskExecutor)
  - Design architecture yourself (use Architect)
  - Mark complete before implementation is done
  - Pass workspace_path with workspace_mode="existing"

  # OUTPUT FORMAT

  Success criteria - mark complete when:
  1. Design phase complete (if needed): Architecture docs created
  2. Implementation phase complete: Code written, tests passing
  3. All acceptance criteria met

  Typical workflow:
  ```
  consult_architect(project_description=..., requirements=..., constraints=...)
  → wait for completion
  delegate_to_executor(task_description=..., workspace_mode="existing")
  → wait for completion
  mark_complete(summary="...")
  ```

behaviors:
  # Execution Mode
  # Manages execution mode activation, tool usage enforcement, and completion signals
  - type: ExecutionModeBehavior
    params:
      enable_completion_nudging: true
      min_rounds_before_nudge: 3
      max_empty_rounds: 3

  # Chatbot Mode
  # NOTE: All agents now have core goal/completion functionality built into BaseAgent
  # ChatbotBehavior provides interactive chat mode when no goal provided
  - type: ChatbotBehavior
  # Context Management
  # CompactWhenNearFullBehavior provides append-until-full context management
  - type: CompactWhenNearFullBehavior

  # Utility Behaviors
  # TimeBoxBehavior provides temporal awareness with automatic nudges
  - type: TimeBoxBehavior
    params:
      total_budget_minutes: 240  # 4 hours default for complex projects
      default_nudges: [25, 50, 75]

  # LoopDetectionBehavior detects repeated actions
  - type: LoopDetectionBehavior

  # WorkspaceManagementBehavior provides workspace strategy detection and discovery tools
  # (orchestrator only - other agents work within workspaces but don't manage them)
  - type: WorkspaceManagementBehavior

  # ServerManagementBehavior manages development server lifecycle
  # (orchestrator and task_executor - architect doesn't run code)
  - type: ServerManagementBehavior

  # ContextInspectorBehavior captures context snapshots for debugging
  - type: ContextInspectorBehavior
    params:
      output_dir: ".context_inspection"
      save_full_context: true

  # NOTE: DelegationBehavior is automatically added based on agents.yaml relationships.
  # The orchestrator can delegate to: architect, task_executor (defined in agents.yaml)
  # This creates tools: consult_architect, delegate_to_executor

  # NOTE: The following behaviors are not yet implemented:
  # - ClarificationBehavior (provides user interaction tools)
  # - WorkspaceToolsBehavior (provides workspace management)
  # - WorkspaceTaskNotesBehavior (provides persistent context summaries)
  # - StatusDisplayBehavior (renders progress and performance stats)
  # - TaskManagementBehavior (provides task breakdown and tracking)
