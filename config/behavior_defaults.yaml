# Behavior Parameter Defaults
# These apply to all agents unless overridden in individual agent configs

CompactWhenNearFullBehavior:
  compact_threshold: 0.75   # Compact at 75% capacity
  keep_recent: 5            # Keep last 5 message exchanges after compaction

LoopDetectionBehavior:
  max_repeats: 5            # Warn after 5 identical actions

CommandToolsBehavior:
  # Command whitelist is configured in root-level file: jetbox_commands_whitelist
  # You can override it here with a whitelist parameter if needed

HierarchicalContextBehavior:
  max_depth: 5              # Maximum task nesting
  max_siblings: 8           # Max subtasks per level
  keep_recent: 12           # Message exchanges to keep

DirectoryToolsBehavior:
  # No parameters needed

ReadFileToolsBehavior:
  # No parameters needed

WriteFileToolsBehavior:
  # No parameters needed

ServerToolsBehavior:
  # No parameters needed

ArchitectToolsBehavior:
  # No parameters needed

WorkspaceTaskNotesBehavior:
  # No parameters needed

DelegationBehavior:
  # Parameters come from team configuration relationships
